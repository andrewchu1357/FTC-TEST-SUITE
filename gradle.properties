org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
# Homebrew's keg-only JDK isn't auto-detected; harmless on machines where the path doesn't exist
# (on Windows, Gradle says once per build that the folder isn't there: ignore it. There,
# JAVA_HOME or the .bat launchers supply the JDK).
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
